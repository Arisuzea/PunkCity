{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PunkCity{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'static-images/PunkCity_icon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"> <!-- taste-skill-ignore -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/nav.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/callout.css' %}">
    <link rel="stylesheet" href="{% static 'css/details.css' %}">
    <link rel="stylesheet" href="{% static 'css/steps.css' %}">
    <link rel="stylesheet" href="{% static 'css/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/badges.css' %}">
    <link rel="stylesheet" href="{% static 'css/tables.css' %}">
    <link rel="stylesheet" href="{% static 'css/tabs.css' %}">
    <link rel="stylesheet" href="{% static 'css/slideshow.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/changelog.css' %}">
    {% block extra_head %}{% endblock %}
  </head>

  <body>
    <canvas id="blackwall-bg" aria-hidden="true"></canvas>
    <div id="preloader" aria-hidden="true">
      <div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div>
    </div>
    {% include "includes/nav.html" %}

    <main id="main">
      {% block content %}{% endblock %}
    </main>

    <!-- ═══ JAVASCRIPT ═══ -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script src="{% static 'js/domHelpers.js' %}"></script>
    <script src="{% static 'js/index/navigation.js' %}"></script>
    <script src="{% static 'js/index/tabs.js' %}"></script>
    <script src="{% static 'js/index/slideshow.js' %}"></script>
    <script src="{% static 'js/index/blackwall.js' %}?v=5"></script>
    <script src="{% static 'js/index/main.js' %}"></script>
    <script src="{% static 'js/index/motion.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
